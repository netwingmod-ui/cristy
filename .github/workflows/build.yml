name: Build Loader Dylib

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-13

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Compile loader dylib
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          clang \
            -arch arm64 \
            -isysroot "$SDK" \
            -framework Foundation \
            -dynamiclib \
            -install_name @rpath/libSDKCore.dylib \
            -miphoneos-version-min=12.0 \
            -o libSDKCore.dylib \
            loader.m

      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: loader-dylib
          path: libSDKCore.dylib
